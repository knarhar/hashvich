# Test, build and publish the site to GitHub Pages on every push to main,
# then run a mobile Lighthouse audit against the published pages.
#
# Also rebuilds twice a day, so the pages carry the latest Central Bank of
# Armenia exchange rates: the CBA API cannot be called from a visitor's
# browser, so the rates are fetched here, before the build. 05:00 and 13:00
# UTC are 09:00 and 17:00 in Yerevan; the CBA publishes once per business day.
#
# The site address comes from the repository's Pages settings: the
# knarhar.github.io/hashvich/ address until a custom domain is set there,
# then the custom domain. Nothing needs changing here when the domain moves.

name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5,13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels a queued older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Fails the run if the CBA cannot be reached: the site then keeps the
      # rates of its last good deploy.
      - run: node scripts/fetch-cba-rates.mjs
      - run: npm test
      - run: npm run check

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  lighthouse:
    needs: deploy
    # A rate refresh changes figures, not pages: audit on code changes only.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Audit every calculator page in every language (mobile)
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir -p reports
          echo "| Page | Performance | Accessibility | Best practices | SEO |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          # Every page in the sitemap except the three home pages.
          site="${PAGE_URL%/}"
          urls=$(curl -fsS "$site/sitemap-0.xml" | grep -o '<loc>[^<]*</loc>' \
            | sed -E 's#</?loc>##g' | grep -vE '/(ru|hy|en)/$' | sort)
          # A throwaway first run on a real calculator page: the first audit on
          # a fresh runner pays for Chrome's cold start ("unattributable"
          # script time) and scores lower than the page deserves.
          npx --yes lighthouse@12 "$(echo "$urls" | tail -1)" --quiet --form-factor=mobile \
            --chrome-flags="--headless=new --no-sandbox" --output=json \
            --output-path=/tmp/warmup.json || true
          for url in $urls; do
            path="${url#"$site"/}"
            name=$(echo "$path" | tr '/' '_' | sed 's/_$//')
            npx --yes lighthouse@12 "$url" \
              --quiet --form-factor=mobile \
              --chrome-flags="--headless=new --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output=html --output-path="reports/${name}"
            node -e '
              const r = require(process.argv[1]);
              const s = (k) => Math.round(r.categories[k].score * 100);
              console.log(`| ${process.argv[2]} | ${s("performance")} | ${s("accessibility")} | ${s("best-practices")} | ${s("seo")} |`);
            ' "$PWD/reports/${name}.report.json" "$path" >> "$GITHUB_STEP_SUMMARY"
          done
          cat "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: reports
